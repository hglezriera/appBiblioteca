<style>
:root{
  --color-bg:#f3f2f2;--color-surface:#eae9e9;--color-text:#201f1d;--color-accent:#b68235;
  --color-divider:color-mix(in srgb,#201f1d 16%,transparent);
  --color-neutral-100:#f8f4f4;--color-neutral-200:#eae7e7;--color-neutral-300:#d7d3d3;
  --color-neutral-700:#605d5d;--color-neutral-800:#444141;--color-neutral-900:#2d2b2b;
  --color-accent-100:#fff3e4;--color-accent-700:#7d5411;--color-accent-800:#5a3b0a;
  --font-heading:"Cormorant Garamond",Georgia,serif;--font-heading-weight:600;
  --font-body:"Lora",Georgia,serif;
  --space-2:9.2px;--space-3:13.8px;--space-4:18.4px;
  --radius-md:4px;
  --shadow-sm:0 1px 2px color-mix(in srgb,#2d2b2b 14%,transparent);
  --shadow-lg:0 12px 32px color-mix(in srgb,#2d2b2b 22%,transparent);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--color-surface);color:var(--color-text);font-family:var(--font-body);-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:var(--font-heading);font-weight:var(--font-heading-weight);margin:0}
a{color:var(--color-accent-700);text-decoration:none}
a:hover{color:var(--color-accent)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}
::selection{background:var(--color-accent-100)}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--color-text) 20%,transparent);border-radius:3px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;
  font-family:inherit;font-size:13px;min-height:36px;padding:7px 14px;background:transparent;
  color:var(--color-text);border:1px solid transparent;border-radius:var(--radius-md)}
.btn svg{display:block}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{color:var(--color-accent);border-color:var(--color-accent)}
.btn-primary:hover{background:color-mix(in srgb,var(--color-accent) 12%,transparent)}
.btn-primary:active{background:color-mix(in srgb,var(--color-accent) 22%,transparent)}
.btn-secondary{border-color:var(--color-divider)}
.btn-secondary:hover{background:color-mix(in srgb,var(--color-text) 7%,transparent)}
.btn-secondary:active{background:color-mix(in srgb,var(--color-text) 14%,transparent)}
.btn-ghost{color:var(--color-accent)}
.btn-ghost:hover{background:color-mix(in srgb,var(--color-accent) 10%,transparent)}
.btn-ghost:active{background:color-mix(in srgb,var(--color-accent) 18%,transparent)}
.btn-block{width:100%}
.field>label{display:block;font-size:12px;margin-bottom:5px;color:color-mix(in srgb,var(--color-text) 70%,transparent)}
.input{width:100%;min-height:36px;padding:6px 10px;font:inherit;font-size:14px;color:var(--color-text);
  caret-color:var(--color-accent);background:transparent;border:1px solid var(--color-divider);border-radius:var(--radius-md)}
.input:hover{border-color:color-mix(in srgb,var(--color-text) 45%,transparent)}
.input:focus-visible{border-color:var(--color-accent);outline-offset:0}
textarea.input{min-height:110px;resize:vertical;line-height:1.5}
.tag{display:inline-flex;align-items:center;font-size:11px;letter-spacing:.02em;padding:3px 10px;border-radius:3px}
.tag-neutral{background:var(--color-neutral-100);color:var(--color-neutral-800)}
.tag-accent{background:var(--color-accent-100);color:var(--color-accent-800)}
.tag-outline{border:1px solid var(--color-accent);color:var(--color-accent);font-variant-numeric:tabular-nums}
.card{display:flex;flex-direction:column;gap:var(--space-2);padding:var(--space-3);
  border:1px solid var(--color-divider);border-radius:var(--radius-md)}
.card-kicker{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent)}
.hr{height:1px;border:0;margin:var(--space-4) 0;background:var(--color-divider)}
.muted{color:color-mix(in srgb,var(--color-text) 55%,transparent)}

#page{min-height:100vh;padding:26px 18px 40px;display:flex;flex-direction:column;align-items:center;gap:16px}
#head{width:100%;max-width:960px;display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;

#bezel{padding:13px;border-radius:34px;background:var(--color-neutral-900);box-shadow:var(--shadow-lg)}
#frame{width:392px;height:812px;max-width:calc(100vw - 62px);max-height:calc(100vh - 60px);
  background:var(--color-bg);border:1px solid var(--color-neutral-700);border-radius:22px;
  overflow:hidden;display:flex;flex-direction:column;position:relative}
#frame.tablet{width:860px;height:1080px}
#statusbar{flex:none;display:flex;justify-content:space-between;padding:9px 16px 7px;font-size:10.5px;
  font-variant-numeric:tabular-nums;color:color-mix(in srgb,var(--color-text) 45%,transparent)}
#shell{flex:1;display:flex;min-height:0}
#side{display:none;flex:none;width:186px;border-right:1px solid var(--color-divider);padding:16px 12px;

#frame.tablet #tabbar{display:none}
#main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}

#devsw{display:flex;align-items:center;gap:6px;background:none;border:0;padding:0;cursor:pointer;font:inherit;color:inherit}

#devsw span.track{width:26px;height:14px;flex:none;border-radius:7px;border:1px solid var(--color-accent);

#frame.tablet #devsw span.track{justify-content:flex-end}

#content{flex:1;overflow-y:auto;min-height:0}
#tabbar{flex:none;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;border-top:1px solid var(--color-divider)}

.rows{display:grid;grid-template-columns:1fr}

.row{padding:14px 16px;border-bottom:1px solid var(--color-divider);border-right:1px solid var(--color-divider);

.row .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.overlay{position:absolute;inset:0;background:var(--color-bg);display:flex;flex-direction:column;z-index:5}
.sheetback{position:absolute;inset:0;background:color-mix(in srgb,var(--color-neutral-900) 42%,transparent);
  display:flex;align-items:flex-end;z-index:6}
.sheet{width:100%;max-height:88%;overflow-y:auto;background:var(--color-bg);border-top:1px solid var(--color-divider);
  border-radius:18px 18px 0 0;padding:18px 18px 22px;display:flex;flex-direction:column;gap:13px;box-shadow:var(--shadow-lg)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
#frame.tablet .fgrid{grid-template-columns:1fr 1fr 1fr}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.kpi .num{font-family:var(--font-heading);font-weight:400;font-size:30px;line-height:1.05;
  font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1,'lnum' 1}
.chart h3{font-size:15px;font-weight:400}
.charthead{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--color-divider);padding-bottom:5px}
.charthead span{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;
  font-variant-numeric:tabular-nums;color:color-mix(in srgb,var(--color-text) 45%,transparent)}
.bar{display:grid;grid-template-columns:1fr 46px;gap:10px;align-items:center;cursor:pointer;padding:2px 0}
.bar .lab{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .tr{height:6px;background:var(--color-neutral-100);border-radius:3px;overflow:hidden;margin-top:3px}
.bar .fl{height:100%;background:var(--color-accent);opacity:.75}
.bar .n{font-size:12px;text-align:right;font-variant-numeric:tabular-nums;color:color-mix(in srgb,var(--color-text) 65%,transparent)}
.detgrid{display:grid;grid-template-columns:1fr;gap:0 20px}
#frame.tablet .detgrid{grid-template-columns:1fr 1fr}
.detrow{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--color-divider)}
.detrow .k{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;flex:none;
  color:color-mix(in srgb,var(--color-text) 50%,transparent)}
.detrow .v{font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums}
#toast{position:absolute;left:14px;right:14px;bottom:68px;z-index:9;padding:10px 13px;border:1px solid var(--color-accent);
  border-radius:var(--radius-md);background:var(--color-bg);font-size:11.5px;line-height:1.45;box-shadow:var(--shadow-sm);display:none}
@media (max-width:760px){
  #page{padding:0;gap:0}
  #head,#foot{display:none}
  #bezel{padding:0;border-radius:0;box-shadow:none;background:transparent;width:100%}
  #frame{width:100%!important;height:100dvh!important;max-width:none;max-height:none;border:0;border-radius:0}
  #frame.tablet #side{display:none}
  #frame.tablet #tabbar{display:grid}
  #frame.tablet .rows{grid-template-columns:1fr}
}
</style>

<script>
/* ————— BiblioBP17 ————— catálogo bibliográfico, PWA autocontenida ————— */

const XLSX_CANDIDATES = ['./bibliotecaBP17.xlsx', './data/bibliotecaBP17.xlsx', './uploads/bibliotecaBP17.xlsx'];
const KEY = 'bibliobp17_catalogo_v1';

const FIELDS = [
  ['titulo','Título'],['autor','Autor'],['genero','Género'],['saga','Saga'],['numSaga','Nº en la saga'],
  ['idioma','Idioma'],['editorial','Editorial'],['anio','Año de publicación'],['libreria','Librería'],
  ['estante','Estante'],['seccion','Sección'],['ubicacion','Ubicación'],['palabras','Palabras clave'],
  ['resumen','Resumen','multi']
];
const FILTERS = [['genero','Género'],['idioma','Idioma'],['editorial','Editorial'],['saga','Saga'],
  ['libreria','Librería'],['estante','Estante'],['seccion','Sección'],['anio','Año']];
const ALIAS = {titulo:'titulo',title:'titulo',autor:'autor',author:'autor',libreria:'libreria',estanteria:'libreria',
  estante:'estante',balda:'estante',seccion:'seccion',ubicacion:'ubicacion',localizacion:'ubicacion',genero:'genero',
  generos:'genero',resumen:'resumen',sinopsis:'resumen',saga:'saga',serie:'saga',nenlasaga:'numSaga',nosaga:'numSaga',
  nsaga:'numSaga',numeroenlasaga:'numSaga',numerosaga:'numSaga',ordenenlasaga:'numSaga',idioma:'idioma',lengua:'idioma',
  editorial:'editorial',editor:'editorial',anodepublicacion:'anio',anopublicacion:'anio',ano:'anio',anio:'anio',
  year:'anio',palabrasclave:'palabras',palabras:'palabras',keywords:'palabras',tags:'palabras'};
const ORDER = ['titulo','autor','libreria','estante','seccion','ubicacion','genero','resumen','saga','numSaga','idioma','editorial','anio','palabras'];

const S = { books: [], q: '', filters: {}, tab: 'cat', selId: null, form: null, formMode: '', limit: 60, source: '—', confirmDel: false };

const $ = s => document.querySelector(s);
const el = (t, a, h) => { const n = document.createElement(t); if (a) for (const k in a) k === 'class' ? n.className = a[k] : n.setAttribute(k, a[k]); if (h != null) n.innerHTML = h; return n; };
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fold = s => String(s == null ? '' : s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const norm = s => fold(s).replace(/[^a-z0-9]/g, '');
const fmt = v => (String(v == null ? '' : v).trim() || '—');

let toastTimer;
function toast(msg, ms) {
  const t = $('#toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.style.display = 'none'; }, ms || 2600);
}

/* ——— lectura de .xlsx (sin librerías) ——— */
async function inflate(u8) {
  const s = new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(s).arrayBuffer());
}
async function unzip(buf) {
  const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
  let e = -1;
  for (let i = buf.length - 22; i >= 0; i--) if (dv.getUint32(i, true) === 0x06054b50) { e = i; break; }
  if (e < 0) throw new Error('archivo .xlsx no válido');
  const n = dv.getUint16(e + 10, true); let p = dv.getUint32(e + 16, true); const out = {};
  for (let i = 0; i < n; i++) {
    const method = dv.getUint16(p + 10, true), cs = dv.getUint32(p + 20, true);
    const nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true);
    const lho = dv.getUint32(p + 42, true);
    const name = new TextDecoder().decode(buf.subarray(p + 46, p + 46 + nl));
    const lnl = dv.getUint16(lho + 26, true), lel = dv.getUint16(lho + 28, true);
    const st = lho + 30 + lnl + lel, raw = buf.subarray(st, st + cs);
    out[name] = method === 0 ? raw : await inflate(raw);
    p += 46 + nl + xl + cl;
  }
  return out;
}
function colIndex(ref) {
  const m = /^([A-Z]+)/.exec(ref || ''); if (!m) return 0;
  let n = 0; for (const ch of m[1]) n = n * 26 + (ch.charCodeAt(0) - 64);
  return n - 1;
}
async function parseXlsx(arrayBuffer) {
  const z = await unzip(new Uint8Array(arrayBuffer));
  const dec = new TextDecoder(), P = new DOMParser(), sst = [];
  if (z['xl/sharedStrings.xml']) {
    P.parseFromString(dec.decode(z['xl/sharedStrings.xml']), 'application/xml')
      .querySelectorAll('si').forEach(si => { let s = ''; si.querySelectorAll('t').forEach(t => s += t.textContent); sst.push(s); });
  }
  const key = Object.keys(z).filter(k => /^xl\/worksheets\/sheet\d*\.xml$/.test(k)).sort()[0];
  if (!key) throw new Error('el archivo no contiene hojas');
  const doc = P.parseFromString(dec.decode(z[key]), 'application/xml');
  const val = c => {
    const t = c.getAttribute('t');
    if (t === 's') { const v = c.querySelector('v'); return v ? (sst[+v.textContent] || '') : ''; }
    if (t === 'inlineStr') { const is = c.querySelector('is'); return is ? is.textContent : ''; }
    const v = c.querySelector('v'); return v ? v.textContent : '';
  };
  const rows = [];
  doc.querySelectorAll('row').forEach(r => {
    const a = []; r.querySelectorAll('c').forEach(c => { a[colIndex(c.getAttribute('r'))] = String(val(c)).trim(); });
    rows.push(a);
  });
  const first = rows.findIndex(r => r.filter(Boolean).length >= 3);
  if (first < 0) throw new Error('la hoja está vacía');
  const map = {}; let hits = 0;
  rows[first].forEach((h, i) => { const k = ALIAS[norm(h)]; if (k && map[k] === undefined) { map[k] = i; hits++; } });
  if (hits < 5) ORDER.forEach((k, i) => { map[k] = i; });
  const books = [];
  for (let i = first + 1; i < rows.length; i++) {
    const r = rows[i]; if (!r || !r.filter(Boolean).length) continue;
    const b = { id: 'x' + i };
    FIELDS.forEach(([k]) => { const ix = map[k]; b[k] = ix === undefined ? '' : (r[ix] || ''); });
    if (!b.titulo && !b.autor) continue;
    books.push(b);
  }
  if (!books.length) throw new Error('no se encontraron filas de datos');
  return books;
}
async function fetchRepoXlsx() {
  let last = 'no encontrado';
  for (const url of XLSX_CANDIDATES) {
    try {
      const r = await fetch(url + '?t=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) { last = 'HTTP ' + r.status + ' en ' + url; continue; }
      return { books: await parseXlsx(await r.arrayBuffer()), url };
    } catch (e) { last = (e && e.message) || String(e); }
  }
  throw new Error(last);
}

/* ——— persistencia ——— */
function save(status) {
  try {
    localStorage.setItem(KEY, JSON.stringify({ books: S.books, source: S.source, savedAt: new Date().toISOString() }));
    if (status) toast(status);
  } catch (e) { toast('No se pudo guardar: ' + e.message, 5000); }
  paintHead();
}
function load() {
  try { const raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
}

/* ——— consultas ——— */
function match(b) {
  const q = fold(S.q).trim();
  if (q) {
    const hay = fold([b.titulo, b.autor, b.resumen, b.palabras, b.saga].join(' '));
    for (const w of q.split(/\s+/)) if (hay.indexOf(w) < 0) return false;
  }
  for (const k in S.filters) if ((b[k] || '').trim() !== S.filters[k]) return false;
  return true;
}
const filtered = () => S.books.filter(match);
function groups(list, key, fn) {
  const m = new Map();
  list.forEach(b => { const v = fn ? fn(b) : (b[key] || '').trim(); if (v) m.set(v, (m.get(v) || 0) + 1); });
  return [...m.entries()].sort((a, b) => b[1] - a[1] || String(a[0]).localeCompare(String(b[0]), 'es'));
}

function chart(title, list, key, fn, max, byLabel) {
  let rows = groups(list, key, fn);
  const total = rows.length;
  if (byLabel) rows = rows.slice().sort((a, b) => String(a[0]).localeCompare(String(b[0]), 'es'));
  rows = rows.slice(0, max || 12);
  const top = rows.reduce((m, r) => Math.max(m, r[1]), 1);
  const box = el('div', { class: 'chart', style: 'display:flex;flex-direction:column;gap:8px' });
  box.appendChild(el('div', { class: 'charthead' }, '<h3>' + esc(title) + '</h3><span>' + total + (total === 1 ? ' valor' : ' valores') + '</span>'));
  rows.forEach(r => {
    const b = el('div', { class: 'bar' },
      '<div><div class="lab">' + esc(r[0]) + '</div><div class="tr"><div class="fl" style="width:' +
      Math.max(2, Math.round(r[1] / top * 100)) + '%"></div></div></div><div class="n">' + r[1] + '</div>');
    if (key) b.onclick = () => setFilter(key, r[0]);
    box.appendChild(b);
  });
  return box;
}

function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type: type || 'text/plain;charset=utf-8' }));
  const a = el('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function exportCsv() {
  const cell = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const lines = [FIELDS.map(f => cell(f[1])).join(';')];
  S.books.forEach(b => lines.push(FIELDS.map(f => cell(b[f[0]])).join(';')));
  download('bibliotecaBP17-' + new Date().toISOString().slice(0, 10) + '.csv', '\ufeff' + lines.join('\r\n'), 'text/csv;charset=utf-8');
}
const bookKey = b => norm(b.titulo) + '|' + norm(b.autor);
function mergeBooks(incoming) {
  const seen = new Set(S.books.map(bookKey));
  let added = 0;
  incoming.forEach(b => { if (!seen.has(bookKey(b))) { S.books.push(b); seen.add(bookKey(b)); added++; } });
  return added;
}
async function importRepo(mode) {

    } else {

      save(books.length + ' libros importados del repositorio');

}

/* ——— PWA ——— */
let installEvent = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); installEvent = e; $('#installbtn').style.display = 'inline-flex';
});
$('#installbtn').onclick = async () => {
  if (!installEvent) return;
  installEvent.prompt(); await installEvent.userChoice;
  installEvent = null; $('#installbtn').style.display = 'none';
};
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then(reg => {
      const s = 'Service worker: activo';
      $('#swstate').textContent = s;
      const s2 = document.getElementById('swstate2'); if (s2) s2.textContent = 'activo';
      reg.addEventListener('updatefound', () => toast('Hay una versión nueva: cierra y abre la app.'));
    }).catch(err => { $('#swstate').textContent = 'Service worker: ' + err.message; });
  });
} else {
  $('#swstate').textContent = 'Service worker: requiere http(s)';
}
</script>
</body>
</html>
